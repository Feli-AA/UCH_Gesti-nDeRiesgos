services:
  mysql:
    image: mysql:8.0
    command: --sql-mode=NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - simplerisk_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  simplerisk:
    image: simplerisk/simplerisk-minimal:20260828-001
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_SETUP_PASS: ${MYSQL_ROOT_PASSWORD}
      SIMPLERISK_DB_HOSTNAME: mysql
      SIMPLERISK_DB_USERNAME: simplerisk
      SIMPLERISK_DB_PASSWORD: ${SIMPLERISK_DB_PASSWORD}
      SIMPLERISK_DB_DATABASE: simplerisk
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_NAME: ${ADMIN_NAME}
    ports:
      - "8081:80"
      - "8443:443"
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.37.10
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: America/Argentina/Mendoza
      TZ: America/Argentina/Mendoza
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  simplerisk_mysql_data:
  n8n_data: