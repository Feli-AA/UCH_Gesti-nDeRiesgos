services:
  mysql:
    image: mysql:8.0
    command: --sql-mode=NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - simplerisk_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  simplerisk:
    image: simplerisk/simplerisk-minimal:20260828-001
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_SETUP_PASS: ${MYSQL_ROOT_PASSWORD}
      SIMPLERISK_DB_HOSTNAME: mysql
      SIMPLERISK_DB_USERNAME: simplerisk
      SIMPLERISK_DB_PASSWORD: ${SIMPLERISK_DB_PASSWORD}
      SIMPLERISK_DB_DATABASE: simplerisk
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_NAME: ${ADMIN_NAME}
    ports:
    - "8081:80"
    - "8443:443"
    restart: unless-stopped

volumes:
  simplerisk_mysql_data: