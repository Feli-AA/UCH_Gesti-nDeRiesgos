version: '2.1'

services:
  simplerisk:
    image: simplerisk/simplerisk:latest
    ports:
      - "8080:80"
    environment:
      - SIMPLERISK_DB_HOST=db
      - SIMPLERISK_DB_USER=simplerisk
      - SIMPLERISK_DB_PASSWORD=simplerisk_pass
      - SIMPLERISK_DB_NAME=simplerisk
    depends_on:
      - db

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=root_pass
      - MYSQL_DATABASE=simplerisk
      - MYSQL_USER=simplerisk
      - MYSQL_PASSWORD=simplerisk_pass
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
